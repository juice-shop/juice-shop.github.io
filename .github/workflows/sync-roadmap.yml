name: "Sync back roadmap to owasp.org"

on:
  push:
    branches: [ master ]
    paths:
      - '_data/roadmap_milestones.json'

jobs:
  UpdateAttributionsOnOwaspOrg:
    if: github.repository == 'juice-shop/juice-shop.github.io'
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      with:
        token: ${{ secrets.BOT_TOKEN }}
        repository: OWASP/www-project-juice-shop
        ref: master
    - name: Update roadmap_milestones.json
      run: |
        cd _data
        rm roadmap_milestones.json
        wget https://raw.githubusercontent.com/juice-shop/juice-shop.github.io/${{ github.ref_name }}/_data/roadmap_milestones.json
    - uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 #v5.0.1
      with:
        commit_message: "Auto-update roadmap_milestones.json from ${{ github.sha }}"
        branch: master
        commit_options: '--signoff'

        # Optional commit user and author settings
        commit_user_name: JuiceShopBot
        commit_user_email: 61591748+JuiceShopBot@users.noreply.github.com
        commit_author: JuiceShopBot <61591748+JuiceShopBot@users.noreply.github.com>
